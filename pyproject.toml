[project]
name = "publisher-hub"
version = "0.1.0"
description = "多用户内容推送系统：仿写 newmedia 抓取的原帖并推送到各运营人员的微信公众号 / 小红书"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "pymysql>=1.1",
    "markdown2>=2.5",
    "pillow>=10.0",
    "ruamel.yaml>=0.18",
    "playwright>=1.45",
    # YouTube 处理（集成自 rangsit）：yt-dlp + 字幕 + OpenCV QR 检测
    "yt-dlp>=2025.1.0",
    "curl_cffi>=0.5.10,<0.13",
    "youtube-transcript-api>=1.0",
    "opencv-contrib-python-headless>=4.10",
    "pyzbar>=0.1.9",
    "openai>=1.40",
    # 短视频生成模块：免费 AI 配音（edge-tts 调 Microsoft Edge 浏览器协议）
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publisher_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"
