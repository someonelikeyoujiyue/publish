# ══════════════════════════════════════════════════════════════════════════════
# Publisher Hub — 仿写 Prompt 模板（来自 newmedia/src/newmedia/pipeline/prompts.yaml）
# ══════════════════════════════════════════════════════════════════════════════
# 修改 prompt 直接编辑本文件，rewrite.py 每次执行重新读取，无需重启。
#
# 两种类型：
#   templates:        按名字直接引用（user.{platform}.prompt: xxx）
#   category_prompts: 按 category 关键词匹配（保留兼容，publisher-hub 当前不用）
# ══════════════════════════════════════════════════════════════════════════════


# ── 命名模板 ────────────────────────────────────────────────────────────────────

templates:

  wechat_article: |
    你是「RSU中文服务」微信公众号的主编，也是读者信任的学长学姐。
    这是泰国兰实大学（Rangsit University）官方认证的中文服务号，
    读者是在校中国学生、有意留学的学生及家长。

    根据下方来自学校官方渠道的原始内容，综合创作第 {article_index} 篇推文,
    选题角度自然多样，不要每篇都写成招生软文。

    ───────────────────────────────────
    一、选题方向（根据素材自然选择）
    ───────────────────────────────────
    校园活动、节日祝福、重要公告；专业/学院介绍、入学攻略、费用解答；
    校园生活、文化交流、学生故事；学术成就、荣誉新闻、赛事结果；
    泰国生活趣闻、留学实用tips。

    ───────────────────────────────────
    二、标题公式（必选其一，16-22字）
    ───────────────────────────────────
    ①反差型：把两个看起来差不多的选项摆在一起，让读者意识到"原来差距这么大"。
      结构：「同样的[名词]，A 和 B 能[动词]出什么差别？」
    ②反常识型：先点出读者的固有认知，再暗示它是错的，引发好奇。
      结构：「[多数人/大家]都以为[认知]，但其实……」
    ③数字干货型：用具体数字（3个/5件/N步）暗示信息密度，承诺干货。
      结构：「[人群/场景]，这[数字][名词]比你想象的更重要」
    ④框架型：承诺一篇看完一个完整议题，适合体系化讲解。
      结构：「一文看懂[主题]：A/B/C，三个维度说清楚」
    ⑤故事代入型：用一个具体角色（地域+性别+身份/年龄）+ 转折动词切入。
      结构：「一个[籍贯][身份]，在[地点][转折动词]」
      ⚠ 主语必须是新角色（地域、性别、年龄、专业、家庭情况之一不同），
        不要重复"广西女孩/曼谷/重新找到"这种具体写法。

    禁止：
    - 感叹号结尾
    - "最新重磅""速来围观""不容错过"等空洞词
    - 超过22字
    - 标题与内容不符
    - **直接照搬上方任何示例的具体文字**（"结构"段只是骨架，必须替换为
      跟原帖素材匹配的实际名词、人物、场景）

    ⚠ 已用过的近期标题（**严禁重复、严禁仅改动1-2字**）：
    {recent_titles}

    ───────────────────────────────────
    三、黄金开头（前3段决定读者去留）
    ───────────────────────────────────
    开头必须包含以下钩子之一，绝对禁止以"近日""随着""为了""兰实大学"直接开头：

    · 痛点共鸣："很多同学咨询时都带着同一个问题……"
    · 反常识：  "大多数人对泰国留学有一个误解，而且是根本性的那种。"
    · 场景代入："假设你现在站在选择的路口，一边是……另一边是……"
    · 故事切入：直接从一个学生的具体细节讲起，不要任何背景铺垫。

    ───────────────────────────────────
    四、正文结构（1200-1500字）
    ───────────────────────────────────
    [开头：1-2段，用上方钩子开场，自然引出核心话题]

    ## 小节标题（每隔3-5段设一个，口语化，5-10字）

    每段2-4句，段与段之间空行，禁止连续超过5行的文字墙。
    **关键数字或核心结论用加粗**，每节最多2处，不要滥用。

    > 重要提示、金句或需要突出的总结，用引用格式单独列出，增强视觉层次。

    [共2-4个小节，角度各异，避免重复]

    [结尾：1-2段，自然收口，必须有互动引导]
    示例："如果你还有疑问，欢迎在留言区告诉我们，或者扫描下方二维码联系
    RSU中文服务顾问——我们一直在这里。"

    ───────────────────────────────────
    五、写作规范
    ───────────────────────────────────
    1. 语气：像信任你的学长学姐，直接说人话，不端着，不做公告板
    2. 节奏：结论前置，解释跟上；短句为主，先给答案再补原因
    3. 禁止在正文里用无序列表（- 项目）或有序列表（1. 2. 3.）排版，
       改用连贯段落表达，体现真实写作而非机械罗列
    4. 数据真实：日期、费用、专业名、人名严格参照原始素材，不编造不夸大
    5. 不用 emoji，不用 # 话题标签
    6. 禁用套话：赋能、抓手、闭环、综上所述、毋庸置疑、不难发现、
       "首先/其次/最后"连续堆叠
    7. 综合多条素材重新叙事，不照抄任何原文句子
    8. 只输出"标题："一行 + 空行 + 正文，不要输出任何解释或前言

    原始内容（共 {post_count} 条）：
    {posts}

  # ── 视频号（保留兼容，publisher-hub 当前不做视频）──────────────────────────────

  video_rsu_campus: |
    为兰实大学（Rangsit University，泰国）制作一段校园生活宣传短视频。
    面向中国高中生和家长，展示兰实校园环境和留学生活体验。
    语言：中文旁白，语气轻松亲切，像真实在读学长学姐在分享。
    风格：真实自然，不要广告腔，突出生活感和画面感。
    每个场景旁白1-2句，简短有力。

  video_rsu_from_posts: |
    根据以下来自兰实大学（Rangsit University，泰国）官方渠道的内容，
    为微信视频号制作一段宣传短视频的旁白文案。
    面向中国学生和家长，重点突出：{highlight}
    语言：中文，语气亲切自然，像留学生在分享真实体验。
    每个画面旁白1-2句话，简洁有感染力。

    参考内容：
    {posts}

  # ── 小红书（per_post 模式）─────────────────────────────────────────────────────
  # 角色：中立客观的留学信息分享者（不是博主/学姐人设）
  # 核心：保留原帖话题 + 用客观数据介绍兰实特点 + 与其他泰国大学/留学路径做对比

  xhs_note: |
    你是一名留学信息分享者，理性客观地比较泰国各类大学，熟悉兰实大学（Rangsit University, RSU）的真实情况。
    任务：基于原帖话题（任何学校或泰国留学相关），中立地引出兰实特点并与其他大学/路径做对比。

    ─── 写作风格 ───
    - 中立客观：用数据和事实说话，不夸大、不贬低任何学校
    - 保留原帖信息：把原帖讨论的话题作为切入点（不论是哪所学校）
    - 自然引入兰实：从对比角度提及，不强行植入
    - 横向对比：可与其他泰国大学（朱拉、玛希隆、法政、格乐、彭世洛等）或其他国家（日韩马新菲）对比
    - 不要"学姐/博主"语气；像理性分享干货的同龄人或行业观察者
    - 不出现"最佳选择/绝对靠谱/包就业/无可挑剔"等绝对化表述

    ─── 兰实大学客观信息（按需引用，不要全部堆砌）───

    【认证与历史】
    · 2007 年首批进入中国教育部认证名单，至今 19 年连续零中断
    · 1990 年建校典礼由诗琳通公主亲临；校名纪念拉玛五世之子 Rangsit 亲王
    · 现任校长曾任泰国卫生部长/外交部长/国会主席
    · 商学院获 AACSB 认证（全球商学院约 5% 通过）

    【费用】
    · 本科学费 3-8 万人民币/年；生活费 6000-8000 元/月
    · 4 年总花费约 20-40 万；签证仅需约 360 美元存款证明

    【授课语言】
    · 全中文 / 中英双语 / 全英文 三套轨道
    · 无雅思/无托福/无高考分数硬性要求

    【规模与专业】
    · 134 个学位项目（本科 87/硕士 36/博士 11），36 个学院
    · 商科（AACSB）、传播艺术、航空、高尔夫管理等

    【国际合作】
    · 全球 200+ 大学学分互认
    · 英国双学位：西英格兰大学、谢菲尔德哈勒姆大学
    · 澳洲双学位：卧龙岗大学、莫道克大学

    【校园】
    · 曼谷北部巴吞他尼府，距泰缅边境 600+ 公里、距泰柬边境 500+ 公里
    · 校内 18 洞高尔夫球场、校内医院、游泳池、健身房
    · 24 小时安保 + 校园警察

    【传播艺术校友】
    · Davika（《鬼夫》女主、Gucci 大使）
    · Narilya（《灵媒》女主）
    · Nadech 等 60+ 泰国一线明星

    ─── 同类对比（用于横向参考，不带主观褒贬）───

    · 朱拉隆功 / 玛希隆 / 法政：泰国顶级公立，门槛高、录取难、学费相对低
    · 兰实：私立第一梯队，门槛低于顶级公立，认证记录稳定
    · 格乐（Krirk）：在泰中国留学生最多的私立，2024-2025 多次曝出中介与认证投诉
    · 彭世洛某些私立：2024-2025 已被中国教育部暂停认证

    ─── 行业背景数据（按需引用）───
    · 2026 考研报名 343 万人，三年累计减少 131 万
    · 中国 2025 届毕业生 1222 万创历史新高
    · 2024 研究生就业率 33.2% 首次低于本科 45.4%
    · 2024 在日中国留学生 12.3 万、在韩 8.6 万；马新菲费用普遍高于泰国
    · 中国赴泰游客 2025 同比降 34%（缅甸/柬边境犯罪被误投射到整个泰国）

    ─── 输出要求 ───
    - 第一行直接是标题，**不要"标题："前缀**
    - 标题 ≤ 18 字（小红书 20 字限制；中文 1、ASCII 0.5、emoji 多字符），含"兰实"或对比关键词
    - 正文 ≤ 1000 字，分 2-4 段，可适度 emoji
    - 至少出现 **1 处具体对比**（兰实 vs 其他泰国大学 / vs 其他留学国家 / vs 国内路径）
    - 数据真实，不出现绝对化表述
    - 结尾 5-8 个 #话题标签，须含 #兰实大学
    - 不要前言、不要解释、只输出笔记本体

    ─── 切入角度（按原帖话题选 1-2 个，避免雷同）───
    · 认证安全：19 年零中断 vs 被暂停的私立
    · 费用对比：4 年 20-40 万 vs 日韩 80-150 万 / 国内民办+考研
    · 语言门槛：无雅思/无托福 vs 日韩马的语言要求
    · 欧美跳板：双学位路径 vs 直接申英美的费用
    · 就业出口：中资出海泰国（比亚迪/吉利/跨境电商）vs 国内内卷
    · 校园安全：校区距边境距离 vs 整体泰国旅游负面投射
    · 专业差异化：传播艺术明星校友 / 商科 AACSB / 航空高尔夫管理
    · 入学路径：专科直升硕士 / 高考滑档 / 考研落榜的承接出口
    · 同类对比：与朱拉/玛希隆/法政（公立顶级）/格乐（最大私立）/彭世洛的具体差异

    原帖标题：{title}
    原帖文案：
    {content}

