{# 推送失败响应：错误展示 + 重试按钮 #}
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;
            max-width:100%;">
  <span class="badge badge-failed" style="padding:6px 10px;line-height:1.4;
        max-width:100%;word-break:break-all;white-space:normal;">
    ✗ {{ error[:200] }}
  </span>
  <button class="btn btn-primary"
          hx-post="{{ retry_url }}"
          hx-swap="outerHTML"
          hx-disabled-elt="this"
          hx-confirm="{{ confirm_msg }}">
    <span class="btn-text">🔄 {{ btn_label }}</span>
    <span class="btn-loading"><span class="spinner"></span> {{ loading_label }}…</span>
  </button>
</div>
